const defaultAulaState = () => ({ mc: {}, vf: {}, open: {}, checklist: {}, challenge: "", completed: false });

function countAnswerable(aula) {
  let n = 0;
  aula.subtemas.forEach((s) => s.perguntas.forEach((p) => { if (p.tipo === "mc" || p.tipo === "vf") n++; }));
  return n;
}
function countAnswered(state, aula) {
  let n = 0;
  aula.subtemas.forEach((s, si) => s.perguntas.forEach((p, pi) => {
    const key = `${si}-${pi}`;
    if (p.tipo === "mc" && state.mc[key]) n++;
    if (p.tipo === "vf" && state.vf[key] && Object.keys(state.vf[key]).length === p.itens.length) n++;
  }));
  return n;
}

function TrailNode({ aula, status, onClick, side }) {
  const color = status === "completed" ? T.green : status === "progress" ? T.amber : T.stone;
  const bg = status === "completed" ? T.green : status === "progress" ? T.amberSoft : T.paperCard;
  const iconColor = status === "completed" ? "#fff" : status === "progress" ? T.amber : T.inkSoft;

  return (
    <div style={{ display: "flex", justifyContent: side === "left" ? "flex-start" : "flex-end", width: "100%", position: "relative" }}>
      <button
        onClick={onClick}
        style={{
          display: "flex", alignItems: "center", gap: "0.9rem",
          flexDirection: side === "left" ? "row" : "row-reverse",
          width: "min(430px, 88%)", textAlign: side === "left" ? "left" : "right",
          background: "none", border: "none", cursor: "pointer", padding: "0.4rem 0",
        }}
      >
        <span
          style={{
            flexShrink: 0, width: 58, height: 58, borderRadius: "999px",
            display: "flex", alignItems: "center", justifyContent: "center",
            background: bg, border: `2.5px solid ${color}`,
            boxShadow: status === "progress" ? `0 0 0 5px ${T.amberSoft}` : "none",
          }}
        >
          {status === "completed" ? (
            <CheckCircle2 size={26} color={iconColor} strokeWidth={2.4} />
          ) : (
            <span style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 20, color: iconColor }}>
              {String(aula.id).padStart(2, "0")}
            </span>
          )}
        </span>
        <span>
          <span style={{
            display: "block", fontFamily: "Inter, sans-serif", fontSize: 11, fontWeight: 600,
            letterSpacing: "0.02em", color: T.inkSoft, marginBottom: 2,
          }}>
            Aula {String(aula.id).padStart(2, "0")} · pág. {aula.paginas}
          </span>
          <span style={{
            fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 17, lineHeight: 1.25, color: T.ink,
          }}>
            {aula.titulo}
          </span>
        </span>
      </button>
    </div>
  );
}

function MC({ q, value, onChange }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <p style={{ fontFamily: "Inter, sans-serif", fontWeight: 600, fontSize: 14.5, color: T.ink, marginBottom: 10 }}>{q.pergunta}</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {q.alternativas.map((alt) => {
          const selected = value === alt.letra;
          const isCorrect = alt.letra === q.correta;
          let border = T.line, bg = T.paperCard, txt = T.ink;
          if (value) {
            if (isCorrect) { border = T.green; bg = T.greenSoft; }
            else if (selected) { border = T.red; bg = T.redSoft; }
          }
          if (selected) border = isCorrect ? T.green : T.red;
          return (
            <button
              key={alt.letra}
              disabled={!!value}
              onClick={() => onChange(alt.letra)}
              style={{
                display: "flex", alignItems: "center", gap: 10, textAlign: "left",
                border: `1.5px solid ${border}`, background: bg, borderRadius: 12,
                padding: "10px 14px", cursor: value ? "default" : "pointer",
                fontFamily: "Inter, sans-serif", fontSize: 13.5, color: txt,
              }}
            >
              <span style={{
                width: 24, height: 24, borderRadius: 999, flexShrink: 0, fontSize: 12, fontWeight: 700,
                display: "flex", alignItems: "center", justifyContent: "center",
                background: value && selected ? border : "transparent",
                color: value && selected ? "#fff" : T.inkSoft,
                border: `1.5px solid ${value && selected ? border : T.stone}`,
              }}>{alt.letra}</span>
              <span style={{ flex: 1 }}>{alt.texto}</span>
              {value && isCorrect && <CheckCircle2 size={17} color={T.green} />}
              {value && selected && !isCorrect && <X size={17} color={T.red} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function VF({ q, value, onChange }) {
  const val = value || {};
  return (
    <div style={{ marginBottom: 18 }}>
      <p style={{ fontFamily: "Inter, sans-serif", fontWeight: 600, fontSize: 14.5, color: T.ink, marginBottom: 10 }}>{q.pergunta}</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {q.itens.map((item, idx) => {
          const answered = val[idx];
          const isRight = answered === item.gabarito;
          return (
            <div key={idx} style={{
              display: "flex", alignItems: "center", gap: 12, border: `1.5px solid ${answered ? (isRight ? T.green : T.red) : T.line}`,
              background: answered ? (isRight ? T.greenSoft : T.redSoft) : T.paperCard,
              borderRadius: 12, padding: "10px 14px",
            }}>
              <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                {["V", "F"].map((opt) => (
                  <button
                    key={opt}
                    disabled={!!answered}
                    onClick={() => onChange({ ...val, [idx]: opt })}
                    style={{
                      width: 30, height: 30, borderRadius: 8, fontSize: 12.5, fontWeight: 700,
                      fontFamily: "Inter, sans-serif", cursor: answered ? "default" : "pointer",
                      border: `1.5px solid ${answered === opt ? (isRight ? T.green : T.red) : T.stone}`,
                      background: answered === opt ? (isRight ? T.green : T.red) : "transparent",
                      color: answered === opt ? "#fff" : T.inkSoft,
                    }}
                  >{opt}</button>
                ))}

/* ============================================================
   GERAÇÃO DE PDF (jsPDF) — download real, sem depender de diálogo de impressão
   ============================================================ */
function fmtDate() {
  return new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function useJsPDF() {
  const [ready, setReady] = useState(() => !!(window.jspdf && window.jspdf.jsPDF));
  const [error, setError] = useState(false);

  useEffect(() => {
    if (ready) return;
    if (window.jspdf && window.jspdf.jsPDF) { setReady(true); return; }

    let existing = document.querySelector('script[data-lib="jspdf"]');
    if (!existing) {
      existing = document.createElement("script");
      existing.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      existing.async = true;
      existing.setAttribute("data-lib", "jspdf");
      document.body.appendChild(existing);
    }
    const onLoad = () => setReady(!!(window.jspdf && window.jspdf.jsPDF));
    const onError = () => setError(true);
    existing.addEventListener("load", onLoad);
    existing.addEventListener("error", onError);
    return () => {
      existing.removeEventListener("load", onLoad);
      existing.removeEventListener("error", onError);
    };
  }, [ready]);

  return { ready, error };
}

const PDF_C = {
  green: [30, 122, 70],
  greenBanner: [60, 154, 102],
  greenSoft: [228, 239, 230],
  amber: [193, 134, 43],
  amberSoft: [251, 244, 232],
  ink: [30, 42, 34],
  inkSoft: [76, 90, 80],
  line: [207, 202, 187],
  redSoft: [245, 225, 220],
};

function downloadLessonPdf(aula, state, studentName) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const mx = 44;
  const maxW = pageW - 2 * mx;
  const bottomLimit = pageH - 48;
  let y = 50;

  const setColor = (fn, rgb) => fn(rgb[0], rgb[1], rgb[2]);

  function ensure(space) {
    if (y + space > bottomLimit) {
      doc.addPage();
      y = 50;
    }
  }

  function text(str, x, size, style, color, opts) {
    doc.setFont("helvetica", style || "normal");
    doc.setFontSize(size);
    setColor(doc.setTextColor.bind(doc), color || PDF_C.ink);
    doc.text(str, x, y, opts || {});
  }

  function wrapped(str, width, size, style) {
    doc.setFont("helvetica", style || "normal");
    doc.setFontSize(size);
    return doc.splitTextToSize(str, width);
  }

  function paragraph(str, size, style, color, leading, indent) {
    const lines = wrapped(str, maxW - (indent || 0), size, style);
    lines.forEach((line) => {
      ensure(leading);
      text(line, mx + (indent || 0), size, style, color);
      y += leading;
    });
  }

  setColor(doc.setFillColor.bind(doc), PDF_C.green);
  doc.roundedRect(mx, y - 15, 92, 22, 4, 4, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10.5);
  doc.setTextColor(255, 255, 255);
  doc.text(`AULA ${String(aula.id).padStart(2, "0")}`, mx + 46, y, { align: "center" });
  y += 30;

  wrapped(aula.titulo, maxW, 17, "bold").forEach((line) => {
    ensure(20);
    text(line, mx, 17, "bold", PDF_C.ink);
    y += 20;
  });

  text(`Baseado no conteúdo das páginas ${aula.paginas}`, mx, 9, "italic", PDF_C.inkSoft);
  y += 14;
  const metaLine = `Aluno(a): ${studentName && studentName.trim() ? studentName : "____________________________"}    |    Data: ${fmtDate()}    |    Status: ${state.completed ? "Concluida" : "Em andamento"}`;
  paragraph(metaLine, 9.5, "normal", PDF_C.inkSoft, 12);
  y += 4;
  setColor(doc.setDrawColor.bind(doc), PDF_C.green);
  doc.setLineWidth(1.3);
  doc.line(mx, y, pageW - mx, y);
  y += 22;

  aula.subtemas.forEach((sub, si) => {
    ensure(30);
    setColor(doc.setFillColor.bind(doc), PDF_C.greenBanner);
    doc.rect(mx, y - 13, maxW, 19, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10.5);
    doc.setTextColor(255, 255, 255);
    doc.text(sub.nome, mx + 8, y + 1);
    doc.setFont("helvetica", "italic");
    doc.setFontSize(8);
    doc.text(`pag. ${sub.pagina}`, pageW - mx - 8, y + 1, { align: "right" });
    y += 24;

    sub.perguntas.forEach((p, pi) => {
      const key = `${si}-${pi}`;

      if (p.tipo === "mc") {
        paragraph(p.pergunta, 10.5, "bold", PDF_C.ink, 13);
        y += 2;
        const chosen = state.mc[key];
        p.alternativas.forEach((alt) => {
          const isChosen = chosen === alt.letra;
          const isCorrect = alt.letra === p.correta;
          let suffix = "";
          if (isChosen && isCorrect) suffix = "  (resposta do aluno - correta)";
          else if (isChosen && !isCorrect) suffix = "  (resposta do aluno - incorreta)";
          else if (isCorrect) suffix = "  (resposta correta)";
          const label = `${alt.letra}) ${alt.texto}${suffix}`;
          const style = isChosen ? "bold" : "normal";
          const color = isChosen ? (isCorrect ? PDF_C.green : [179, 67, 46]) : PDF_C.ink;
          paragraph(label, 9.5, style, color, 12, 4);
        });
        y += 8;
      } else if (p.tipo === "vf") {
        paragraph(p.pergunta, 10.5, "bold", PDF_C.ink, 13);
        y += 2;
        const val = state.vf[key] || {};
        p.itens.forEach((item, idx) => {
          const chosen = val[idx];
          const right = chosen === item.gabarito;
          const mark = chosen ? chosen : " ";
          const tag = chosen ? (right ? "(correto)" : `(incorreto - gabarito: ${item.gabarito})`) : "(nao respondida)";
          const label = `[${mark}]  ${item.texto}   ${tag}`;
          const color = chosen ? (right ? PDF_C.green : [179, 67, 46]) : PDF_C.ink;
          paragraph(label, 9.5, "normal", color, 12, 4);
        });
        y += 8;
      } else if (p.tipo === "checklist") {
        paragraph(p.pergunta, 10.5, "bold", PDF_C.ink, 13);
        y += 2;
        const val = state.checklist[key] || {};
        p.itens.forEach((item, idx) => {
          const mark = val[idx] ? "x" : " ";
          paragraph(`[${mark}]  ${item}`, 9.5, "normal", PDF_C.ink, 12, 4);
        });
        y += 8;
      } else {
        paragraph(p.pergunta, 10.5, "bold", PDF_C.ink, 13);
        const resp = state.open[key];
        paragraph(resp && resp.trim() ? resp : "(nao respondida)", 9.5, resp ? "normal" : "italic", PDF_C.inkSoft, 12, 4);
        y += 8;
      }
    });
  });

  ensure(40);
  y += 4;
  setColor(doc.setDrawColor.bind(doc), PDF_C.amber);
  doc.setLineWidth(1);
  doc.line(mx, y, pageW - mx, y);
  y += 16;
  text("DESAFIO DA AULA", mx, 9.5, "bold", PDF_C.amber);
  y += 14;
  paragraph(aula.desafio.titulo, 12, "bold", PDF_C.ink, 15);
  paragraph(aula.desafio.texto, 9.5, "italic", PDF_C.inkSoft, 12);
  y += 4;
  text("Resposta:", mx, 9.5, "bold", PDF_C.ink);
  y += 13;
  const challengeResp = state.challenge && state.challenge.trim() ? state.challenge : "(nao respondido)";
  paragraph(challengeResp, 9.5, "normal", PDF_C.ink, 12);

  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(PDF_C.inkSoft[0], PDF_C.inkSoft[1], PDF_C.inkSoft[2]);
    doc.text(`Trilha da Carreira  |  Aula ${String(aula.id).padStart(2, "0")}  |  página ${i} de ${totalPages}`, pageW / 2, pageH - 26, { align: "center" });
  }

  const safeTitle = aula.titulo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  const filename = `aula-${String(aula.id).padStart(2, "0")}-${safeTitle}.pdf`;

  const blob = doc.output("blob");
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.rel = "noopener";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error, info) {
    console.error("Trilha da Carreira — erro capturado:", error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{
          minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center",
          justifyContent: "center", gap: 14, padding: 24, textAlign: "center",
          background: T.paper, fontFamily: "Inter, sans-serif",
        }}>
          <p style={{ fontSize: 15.5, fontWeight: 700, color: T.ink }}>Algo deu errado ao carregar esta tela.</p>
          <p style={{ fontSize: 13, color: T.inkSoft, maxWidth: 380 }}>
            Seu progresso já salvo continua guardado neste navegador. Tente recarregar a página.
          </p>
          <button
            onClick={() => window.location.reload()}
            style={{
              fontFamily: "Inter, sans-serif", fontWeight: 600, fontSize: 13.5, color: "#fff",
              background: T.green, border: "none", padding: "11px 22px", borderRadius: 999, cursor: "pointer",
            }}
          >
            Recarregar página
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function AppInner() {
  const [progress, setProgress] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [activeId, setActiveId] = useState(null);
  const [saveError, setSaveError] = useState(false);
  const [studentName, setStudentName] = useState("");
  const { ready: pdfReady, error: pdfError } = useJsPDF();

  useEffect(() => {
    try {
      const p = storageGet("trilha-progress");
      if (p) setProgress(JSON.parse(p));
    } catch (e) { /* sem progresso salvo ainda */ }
    try {
      const n = storageGet("trilha-aluno-nome");
      if (n) setStudentName(n);
    } catch (e) { /* sem nome salvo ainda */ }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const ok = storageSet("trilha-progress", JSON.stringify(progress));
    setSaveError(!ok);
  }, [progress, loaded]);

  useEffect(() => {
    if (!loaded) return;
    storageSet("trilha-aluno-nome", studentName);
  }, [studentName, loaded]);

  const activeAula = useMemo(() => AULAS.find((a) => a.id === activeId), [activeId]);
  const activeState = activeId ? (progress[activeId] || defaultAulaState()) : null;

  const updateActiveState = (updater) => {
    setProgress((prev) => ({ ...prev, [activeId]: updater(prev[activeId] || defaultAulaState()) }));
  };

  const handleComplete = () => {
    updateActiveState((s) => ({ ...s, completed: true }));
  };

  const handleReset = () => {
    if (window.confirm("Isso vai apagar todo o seu progresso na trilha (neste navegador). Deseja continuar?")) {
      setProgress({});
    }
  };

  const handleDownloadPdf = () => {
    if (!pdfReady || !activeAula || !activeState) return;
    try {
      downloadLessonPdf(activeAula, activeState, studentName);
    } catch (e) {
      window.alert("Não foi possível gerar o PDF agora. Tente novamente em instantes.");
    }
  };

  const idx = activeId ? AULAS.findIndex((a) => a.id === activeId) : -1;
  const hasNext = idx >= 0 && idx < AULAS.length - 1;

  return (
    <div style={{ minHeight: "100vh", background: T.paper, position: "relative" }}>
      <style>{`
        * { box-sizing: border-box; }
        button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid ${T.green}; outline-offset: 2px; }
        textarea:focus { border-color: ${T.green} !important; }
      `}</style>

      <div style={{
        position: "fixed", inset: 0, pointerEvents: "none", opacity: 0.5, zIndex: 0,
        backgroundImage: `radial-gradient(circle at 15% 8%, ${T.greenSoft} 0%, transparent 38%), radial-gradient(circle at 88% 78%, ${T.amberSoft} 0%, transparent 42%)`,
      }} />

      <div style={{ position: "relative", zIndex: 1 }}>
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between",
          padding: "0.9rem 1.4rem", fontFamily: "Inter, sans-serif",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 700, fontSize: 14, color: T.greenDeep }}>
            <Compass size={18} color={T.green} /> Trilha da Carreira
          </div>
          <button
            onClick={handleReset}
            title="Reiniciar progresso"
            style={{
              display: "inline-flex", alignItems: "center", gap: 6, background: "none", border: "none",
              fontSize: 12, color: T.inkSoft, cursor: "pointer", fontFamily: "Inter, sans-serif",
            }}
          >
            <RotateCcw size={13} /> Reiniciar progresso
          </button>
        </div>

        {saveError && (
          <div style={{
            maxWidth: 720, margin: "0 auto 10px", padding: "8px 14px", background: T.redSoft,
            color: T.red, borderRadius: 10, fontFamily: "Inter, sans-serif", fontSize: 12.5, textAlign: "center",
          }}>
            Não foi possível salvar seu progresso automaticamente neste momento (verifique se o navegador permite armazenamento local).
          </div>
        )}

        {!activeAula ? (
          <Trail progress={progress} onOpen={setActiveId} studentName={studentName} onNameChange={setStudentName} />
        ) : (
          <Lesson
            aula={activeAula}
            state={activeState}
            updateState={updateActiveState}
            onBack={() => setActiveId(null)}
            onComplete={handleComplete}
            onNext={() => setActiveId(AULAS[idx + 1].id)}
            hasNext={hasNext}
            onDownloadPdf={handleDownloadPdf}
            pdfReady={pdfReady}
            pdfError={pdfError}
          />
        )}
      </div>
    </div>
  );
}

function App() {
  return (
    <ErrorBoundary>
      <AppInner />
    </ErrorBoundary>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  // Transforma manualmente o JSX acima usando o runtime "classic" (React.createElement),
  // compatível com scripts comuns — evita que o Babel injete "import" automático
  // do runtime moderno, que quebra fora de <script type="module">.
  (function () {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
      filename: "app.jsx",
    }).code;
    var script = document.createElement("script");
    script.textContent = output;
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
